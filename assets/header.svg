<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Kumar Seth</title>
  <desc id="desc">Neon cyan and violet developer profile banner for a Java developer and computer science undergraduate.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#39ff88"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#78eaff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="#080d18"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <path d="M0 266H188L218 236H316M1200 74H1054L1020 108H950M0 300H122M1200 112H1116" fill="none" stroke="url(#neon)" stroke-opacity=".72" stroke-width="2"/>
  <path d="M72 46h94l18 18h72M1128 292h-86l-20-20h-68" fill="none" stroke="#22d3ee" stroke-opacity=".48" stroke-width="1.5"/>
  <circle cx="316" cy="236" r="4" fill="#39ff88"/>
  <circle cx="950" cy="108" r="4" fill="#22d3ee"/>
  <circle cx="238" cy="64" r="3" fill="#8b5cf6"/>
  <circle cx="954" cy="272" r="3" fill="#39ff88"/>
  <rect x="74" y="74" width="1052" height="192" rx="16" fill="#0b1220" fill-opacity=".82" stroke="#9deaff" stroke-opacity=".2"/>
  <path d="M95 90v160M1105 90v160" stroke="url(#neon)" stroke-width="2" stroke-opacity=".7"/>
  <text x="600" y="120" text-anchor="middle" fill="#39ff88" font-family="monospace" font-size="13" letter-spacing="4">DEVELOPER PROFILE  /  AYUSHKR063</text>
  <text x="600" y="177" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="2">AYUSH KUMAR SETH</text>
  <text x="600" y="214" text-anchor="middle" fill="#a5f3fc" font-family="monospace" font-size="17" letter-spacing="1">JAVA DEVELOPER  ·  CSE UNDERGRADUATE</text>
  <text x="600" y="242" text-anchor="middle" fill="#a7b3c7" font-family="Arial, Helvetica, sans-serif" font-size="13">Sandip University  ·  Building practical software, one project at a time</text>
  <path d="M440 255h320" stroke="url(#neon)" stroke-width="2" filter="url(#soft-glow)"/>
