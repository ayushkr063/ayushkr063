    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#36d8ff" stroke-opacity=".045"/></pattern>
    <linearGradient id="cyan"><stop stop-color="#35d5ff"/><stop offset="1" stop-color="#9aeeff"/></linearGradient>
  </defs>
