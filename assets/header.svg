<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Kumar Seth — third-year CSE student and Java developer</title>
  <desc id="desc">Futuristic dark navy banner with cyan circuit traces and a friendly geometric robot icon. Text identifies Ayush Kumar Seth as a third-year Computer Science student and Java developer at Sandip University.</desc>
